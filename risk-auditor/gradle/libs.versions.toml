#
# Version catalog — single source of truth for dependency versions.
#
# VERIFIED on 2026-10-16 against upstream release pages (see docs/ASSUMPTIONS.md):
#   agp 9.4.0          -> developer.android.com/build/releases/gradle-plugin (Sept 2026)
#                         requires Gradle >= 9.6.0, JDK 17, supports up to API 37
#   kotlin 2.4.21      -> kotlinlang.org/docs/releases.html (released 2026-10-08)
#   serialization 1.11.0 and coroutines 1.11.0 -> their GitHub release pages
#
# NOT VERIFIED (no Maven access in the authoring environment): the test-library
# versions below. They are plausible pins, not confirmed-latest. Before the first
# build run `./gradlew dependencies --refresh-dependencies` or use the Android
# Studio version-catalog inspection to confirm/bump them. See docs/LIMITATIONS.md L-01.
#

[versions]
agp = "9.4.0"
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.11.0"

# Android platform
compileSdk = "36"
targetSdk = "36"
minSdk = "26"

# Test libraries — UNVERIFIED pins, see header
junit = "4.13.2"
truth = "1.4.4"
mockk = "1.13.13"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestJunit = "1.2.1"
androidxTestRules = "1.6.1"

# Runtime libraries
okhttp = "4.12.0"
androidxCore = "1.15.0"
androidxWork = "2.10.0"
androidxAnnotation = "1.9.1"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidxWork" }

junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[bundles]
jvm-test = ["junit", "truth", "mockk", "kotlinx-coroutines-test"]
