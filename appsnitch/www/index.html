<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1A26">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<title>AppSnitch · App Risk Audit</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="wordmark" aria-label="AppSnitch" role="img"><span aria-hidden="true">AppS<i class="nflip">n</i>itch</span></div>
    <div class="priv">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span id="privnote"></span>
    </div>
  </header>

  <div class="titlebar">
    <div class="trow"><h1 id="ptitle">Scan</h1><span class="sample" id="sampletag" hidden>Sample data</span></div>
    <div class="search" role="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search apps" aria-label="Search apps" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </div>
  </div>

  <div id="view"></div>
</div>

<nav class="tabs" id="nav" aria-label="Pages"></nav>
<div id="toast-host" aria-live="polite"></div>

<!-- Load order matters: config > content > data layer > UI > controller -->
<script src="js/config.js"></script>
<script src="js/data/content.js"></script>
<script src="js/data/mock-data.js"></script>
<script src="js/data/normalize.js"></script>
<script src="js/data/providers.js"></script>
<script src="js/data/repository.js"></script>
<script src="js/ui/helpers.js"></script>
<script src="js/ui/scan.js"></script>
<script src="js/ui/risk.js"></script>
<script src="js/ui/prevent.js"></script>
<script src="js/app.js"></script>
</body>
</html>
